spring.application.name=demo-ai-application-test
spring.main.allow-bean-definition-overriding=true
spring.main.banner-mode=off

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2
spring.ai.ollama.chat.options.temperature=0.7

spring.ai.openai.api-key=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
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.chat.options.model=liquid/lfm-2.5-2.6b:free

openai.api.key=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
openai.base.url=https://openrouter.ai/api/v1
openai.model=liquid/lfm-2.5-2.6b:free

spring.autoconfigure.exclude=org.springframework.ai.vectorstore.qdrant.autoconfigure.QdrantVectorStoreAutoConfiguration
spring.ai.vectorstore.qdrant.enabled=false

# Fallback property binding placeholders
spring.ai.vectorstore.qdrant.host=127.0.0.1
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=test_collection

# ==========================================
# 5. DATABASE CONFIGURATION (In-Memory H2 for ChatMemory)
# ==========================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate DDL generation for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# ==========================================
# 6. LOGGING CONFIGURATION
# ==========================================
logging.level.root=INFO
logging.level.com.example.openai.demo=DEBUG
logging.level.org.springframework.ai=INFO
logging.level.org.hibernate.engine.transaction.jta.platform.internal=ERROR

logging.level.org.springframework.web.client.RestTemplate=DEBUG
logging.level.org.springframework.web.reactive.function.client.ExchangeFunctions=TRACE
logging.level.com.openai=TRACE